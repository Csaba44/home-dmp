name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Build edge-services
        run: make build

      - name: Compress release folder
        shell: bash
        run: |
          mkdir homefloor
          cp bin/* homefloor/
          zip -r homefloor-${{ github.ref_name }}.zip homefloor

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: homefloor-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}