services:
  edge:
    build:
      context: edge-services
      target: dev
    volumes:
      - ./edge-services:/app:rw
      - ./edge-services/logs:/app/logs
      - ./homefloor-data:/root/.homefloor
    env_file:
      - .env
  notifications:
    build:
      context: notifications
      target: dev
    volumes:
      - ./notifications:/app:rw
      - ./notifications/logs:/app/logs
      - ./homefloor-data:/root/.homefloor
    env_file:
      - .env