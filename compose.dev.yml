services:
  edge:
    build:
      context: edge-services
      target: dev
    volumes:
      - ./edge-services:/app:rw
      - ./logs:/app/logs
    env_file:
      - .env
  notifications:
    build:
      context: notifications
      target: dev
    volumes:
      - ./notifications:/app:rw
      - ./logs:/app/logs
    env_file:
      - .env